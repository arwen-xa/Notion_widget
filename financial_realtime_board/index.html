<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态金融数据看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="financial-widget">
        <div class="header">
            <h1>📈 金融数据看板</h1>
            <p class="subtitle">实时追踪您关注的金融产品</p>
        </div>
        
        <!-- 添加产品控制面板 -->
        <div class="control-panel">
            <!-- 面板头部 - 可点击展开/折叠▶ -->
            <div class="panel-header" id="control-panel-header">
                <h3>添加...</h3>
                <button class="toggle-btn" id="toggle-panel-btn">展开</button>
            </div>
            <!-- 面板内容 - 默认隐藏 -->
            <div class="panel-content" id="control-panel-content" style="display: none;">
                <!-- 添加单个产品 -->
                <div class="add-product-form">
                    <select id="product-type">
                        <option value="stock">股票/指数</option>
                        <option value="fund">基金</option>
                        <option value="crypto">加密货币</option>
                    </select>
                    <input type="text" id="product-code" placeholder="输入代码 (如: sh000001)" />
                    <input type="text" id="product-name" placeholder="输入名称 (可选)" />
                    <button id="add-product-btn" class="primary-btn"> + </button>
                </div>
                <!-- 添加多个产品组合 -->
                <div class="add-products-form">
                    <input type="text" id="products-info" placeholder="输入产品组合 type1, code1, name1; type2, code2, name2; ..." />
                    <button id="add-products-btn" class="primary-btn"> + 批量添加 </button>
                </div>
                
                <!-- 快速添加示例 -->
                <div class="quick-add">
                    <span class="quick-add-label">快速添加:</span>
                    <div class="quick-add-buttons">
                        <button class="quick-btn" onclick="quickAdd('stock', 'sh000001', '上证指数')">上证指数</button>
                        <button class="quick-btn" onclick="quickAdd('stock', 'sz399001', '深证成指')">深证成指</button>
                        <button class="quick-btn" onclick="quickAdd('fund', '161725', '招商白酒')">招商白酒</button>
                        <button class="quick-btn" onclick="quickAdd('crypto', 'BTCUSDT', '比特币')">比特币</button>
                    </div>
                </div>
                <!-- 新增：提取当前产品列表功能 -->
                <div class="extract-products-section">
                    <div class="extract-form">
                        <button id="extract-products-btn" class="primary-btn">获取当前产品</button>
                        <input type="text" id="products-output" placeholder="当前产品列表 type1, code1, name1; type2, code2, name2;..."
                            readonly />
                    </div>
                </div>
            </div>
        </div>

        <!-- 产品展示区域 -->
        <div class="products-container">
            <div id="products-list">
                <!-- 动态内容 -->
            </div>
        </div>

        <!-- 状态信息 -->
        <div class="status-bar">
            <!-- 左侧：文字信息 -->
            <div class="status-left">
                <div class="status-row">
                    <span id="product-count">产品数量: 0</span>
                    <span class="divider">|</span>
                    <span id="last-update">最后更新: --</span>
                </div>
                <div class="update-frequency">更新频率: 股票/加密货币10分钟 | 基金30分钟</div>
                </div>
                <!-- 右侧：按钮 -->
                <div class="status-right">
                    <div class="button-row">
                        <button id="refresh-all-btn" class="secondary-btn">🔄 刷新全部</button>
                </div>
                <div class="button-row">
                    <button id="delete-all-btn" class="secondary-btn">🗑️ 删除全部</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
